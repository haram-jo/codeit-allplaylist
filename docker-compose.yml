services:
  # 1. Gateway (Nginx)
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "80:80"
    # API 컨테이너가 꺼져있으니까 잠시 주석 (로컬 API로 돌리는 중이니까)
    #depends_on:
    #  - api
    # [핵심 추가] 로컬 호스트 주소를 인식하게 함
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  #1-1. MySQL 붙이고나서 추가해줘야 함
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

    # 1-2. Redis 추가
  redis:
    image: redis:latest
    container_name: my-redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  # 2. API Server (Spring Boot)
  api:
    build:
      context: ./services/api # 여기를 수정! (api 폴더 안을 바라보게 함)
      dockerfile: Dockerfile # 해당 폴더 안의 Dockerfile 사용
    container_name: api
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: docker
    env_file:
      - .env
    networks:
      - app-network

  # 3. Batch (Spring Batch)
  batch:
    build:
      context: ./services/batch
      dockerfile: Dockerfile
    container_name: batch
    depends_on:
      - mysql   # api는 로컬에서 돌릴 거니까 여기서 삭제
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - TMDB_ACCESS_TOKEN=${TMDB_ACCESS_TOKEN} # .env 대신 직접 넣어주거나 env_file 사용
    # [추가] Batch가 로컬에서 돌아가는 API 서버를 찾을 수 있게 주소 매핑
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  # 4.Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092" #도커 내부 포트 9092를 내 컴퓨터 포트 9092에 매핑
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092 # 도커 외부에서 도는 API 서버가 카프카를 찾아갈 수 있음
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
